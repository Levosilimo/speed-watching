<!doctype html>
<!-- E2E fixture for the generic player matcher: a plain <video> on a
     non-YouTube origin plus an HLS master playlist registered in the
     resource timeline. The video plays a real (silent) webm source so the
     time-saved metric accrues on real timeupdate ticks — muted autoplay
     with loop keeps it playing under both browser e2e runners. The content
     script (matches <all_urls>) harvests the subtitle track from the
     network layer (the webm src is not a caption resource), renders the
     pill, and applies/re-asserts the rate. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Generic player fixture</title>
  </head>
  <body>
    <video id="generic-video" muted autoplay loop>
      <source src="/fixtures/media/silence.webm" type="video/webm" />
    </video>
    <script>
      fetch('/fixtures/hls/talk/master.m3u8');
    </script>
  </body>
</html>
