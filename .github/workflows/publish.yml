# Store submission — DRAFT. These jobs cannot run until the store credentials
# exist as repository secrets; until then they fail at the upload/sign step
# (with a clear "missing secrets" error from each tool). See
# docs/ci-e2e.md#publishing for the full secret list and setup.
#
# Triggers:
#   - push of a v* tag (intended release flow)
#   - workflow_dispatch with confirm: "publish" (dry-run safety: a stray
#     manual run cannot publish anything)
#
# Each job runs in its own GitHub environment (cws / amo) so approval rules
# and secret scoping can be attached per store.

name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to run the store submission jobs'
        required: true
        default: 'no'

permissions:
  contents: read

# A store submission is a stateful remote operation; never cancel one that
# is already in flight (a re-run after cancel can double-submit).
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  cws:
    name: Chrome Web Store
    runs-on: ubuntu-latest
    environment: cws
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'publish' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run zip
      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        # Pin the exact version: .output keeps every release's zip, so the
        # speed-watcher-*-chrome.zip glob would match two paths and fail.
        # Bump this on every release, before tagging.
        #
        # chrome-webstore-upload-cli@4 `upload` is DRAFT-ONLY (v4 removed
        # --auto-publish): this step lands a draft, and the launch gate is
        # the manual dashboard submit. Publishing programmatically would be
        # invoking the CLI with no subcommand — deliberately not wired up.
        run: npx chrome-webstore-upload-cli@4 upload --source .output/speed-watcher-0.0.2-chrome.zip

  amo:
    name: Firefox Add-ons (AMO)
    runs-on: ubuntu-latest
    environment: amo
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'publish' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # git archive below needs the tag ref (or branch on dispatch) as a
          # local ref, so fetch full history instead of the default depth-1.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run build:firefox
      # AMO's source-submission policy requires the SOURCE at the release
      # point — web-ext's --upload-source-code archives the build output,
      # which does not satisfy it. The archive must be the repo at the tag.
      - name: Build the AMO source archive from the release ref
        run: git archive --format=zip --output=.output/source.zip "$GITHUB_REF_NAME"
      - name: Sign with AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: >
          npx web-ext@8 sign
          --source-dir .output/firefox-mv3
          --channel listed
          --api-key "$WEB_EXT_API_KEY"
          --api-secret "$WEB_EXT_API_SECRET"
          --amo-metadata
          --source-code-zip .output/source.zip
