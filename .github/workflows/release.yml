# GitHub Release assets (zips + userscript) for v* tags. Independent from
# publish.yml: this produces release assets, that submits to the stores.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      # package.json scripts only the chrome zip; the firefox zip is the same
      # wxt zip command with -b firefox.
      - run: bun run zip
      - run: bunx wxt zip -b firefox
      - run: bun run build:userscript
      - name: Extract the CHANGELOG entry for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## " v " ") == 1 { in_entry = 1; next }
            in_entry && /^## / { exit }
            in_entry { print }
          ' CHANGELOG.md > .output/release-body.md
      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            .output/*.zip
            userscript/dist/speed-watcher.user.js
          body_file: .output/release-body.md
