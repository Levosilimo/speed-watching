# GitHub Release: attach the userscript bundle (and nothing else — the store
# zips go through publish.yml's own build steps).
#
# The userscript dist is gitignored, so the Release download URL
# (releases/latest/download/speed-watcher.user.js) is the userscript's only
# install path. Triggered by the same v* tag push as publish.yml.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run build:userscript
      - run: gh release create "$GITHUB_REF_NAME" userscript/dist/speed-watcher.user.js --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
