# GitHub Pages: publish the static site in site/ (privacy policy + landing).
# The privacy-policy URL is mandatory for the CWS listing, so Pages must be
# live before the store submission. The Settings-side click is "Pages source
# = GitHub Actions" — this workflow is the Actions half.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
