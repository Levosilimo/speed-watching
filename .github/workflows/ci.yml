name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip

      - name: aislop gate (SARIF)
        run: |
          bunx aislop scan . --format sarif | tee aislop.sarif | bun run scripts/aislop-gate.ts
      - if: always()
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: aislop.sarif

      # The userscript bundle test (tests/userscript-bundle.test.ts) skips
      # when userscript/dist is absent; build before vitest so the ci lane
      # always asserts the real bundle (same build the e2e-userscript job
      # uses).
      - run: bun run build:userscript
      - run: bun run test
      - run: bun run test:coverage
      - run: bun run scripts/audit-disabled-assertions.ts
      - name: audit lanes (strict)
        env:
          LCE_STRICT_MIRROR: '1'
          LCE_STRICT_COUNT: '1'
          LCE_STRICT_FIXTURES: '1'
        run: bun run scripts/audit-lanes.ts
      - name: Install Lua 5.1 for mpv tests
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - run: bun run test:mpv
      - run: bun run build

      - name: Verify the store bundle ships no window test hooks (SEC-2)
        run: |
          if grep -r --include='*.js' '__speedwatcher' .output/chrome-mv3; then
            echo 'store bundle must not contain __speedwatcher hooks' >&2
            exit 1
          fi

      - name: Verify built manifest version matches package.json
        run: |
          manifest_version="$(bun -e 'console.log(require("./.output/chrome-mv3/manifest.json").version)')"
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          test "$manifest_version" = "$package_version"

      - run: bun run zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-zip
          path: .output/*.zip
          retention-days: 7

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3

  e2e-chromium:
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # Split install: on a cache miss --with-deps fetches the browsers AND
      # their system libs; on a hit the browsers are restored but the libs are
      # not (uncacheable), so install-deps reinstalls just the OS packages.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      # Each e2e job builds its own browser target with the e2e hooks toggle
      # (build:e2e, SEC-2): the shared specs drive the window test hooks, which
      # production builds dead-code-eliminate; the ci job's build stays prod.
      - run: bun run build:e2e
      - run: bun run e2e:chromium

  # Offscreen-document lane on the CfT build (Playwright's managed Chromium
  # IS Chrome for Testing 151 — chrome.offscreen works, headless included).
  # xvfb-run comes with `playwright install --with-deps` and is a harmless
  # wrapper here: the spec defaults to headless, E2E_CFT_HEADED=1 opts into
  # headed.
  e2e-chromium-cft:
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium (CfT managed build)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - run: bun run build:e2e
      - run: xvfb-run -a bun run e2e:cft

  # Userscript E2E loads the BUILT bundle (userscript/dist) via
  # addScriptTag; build it first so the spec can't run against an absent or
  # stale dist and silently drift from userscript/src.
  e2e-userscript:
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - run: bun run build:userscript
      - run: bun run e2e:userscript

  e2e-firefox:
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 25
    env:
      GECKODRIVER_VERSION: "0.37.1"   # wrapper otherwise fetches "latest" at runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      # The three chromium jobs share one playwright cache key; only the
      # first writer saves, so Firefox needs its own key (restore-keys falls
      # back to the chromium entry and the cache-hit=false branch then
      # installs Firefox on top).
      - name: Cache Playwright Firefox
        id: playwright-firefox-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-firefox-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-firefox-
            ${{ runner.os }}-playwright-
      # Same browser the local runner verifies: the Playwright-patched build
      # (e2e/firefox/run.ts resolution order prefers it), which is proven to
      # speak Marionette to geckodriver 0.37.1.
      - name: Install Playwright Firefox
        if: steps.playwright-firefox-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps firefox
      - name: Install Playwright system dependencies
        if: steps.playwright-firefox-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps firefox
      - run: bun run build:firefox:e2e
      - run: bun run e2e:firefox
