name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip

      - name: aislop gate (SARIF)
        run: |
          bunx aislop scan . --format sarif | tee aislop.sarif | bun run scripts/aislop-gate.ts
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: aislop.sarif

      - run: bun run test
      - run: bun run build

      - name: Verify built manifest version matches package.json
        run: |
          manifest_version="$(bun -e 'console.log(require("./.output/chrome-mv3/manifest.json").version)')"
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          test "$manifest_version" = "$package_version"

      - run: bun run zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: .output/*.zip

  e2e-chromium:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      # Each e2e job builds its own browser target; the ci job's build/zip
      # is for the artifact and the version gate.
      - run: bun run build
      - run: bun run e2e:chromium

  # Offscreen-document lane on the CfT build (Playwright's managed Chromium
  # IS Chrome for Testing 151 — chrome.offscreen works, headless included).
  # xvfb-run comes with `playwright install --with-deps` and is a harmless
  # wrapper here: the spec defaults to headless, E2E_CFT_HEADED=1 opts into
  # headed.
  e2e-chromium-cft:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium (CfT managed build)
        run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: xvfb-run -a bun run e2e:cft

  e2e-firefox:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      # Real Firefox from the Mozilla APT repo. The Ubuntu snap package is
      # unusable in CI (snapd is not available on runners), and firefox-esr
      # lags the release channel.
      - name: Install Firefox from Mozilla APT repo
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://packages.mozilla.org/apt/repo-signing-key.gpg | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" | sudo tee /etc/apt/sources.list.d/mozilla.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y firefox
      - run: bun run build:firefox
      - run: bun run e2e:firefox
